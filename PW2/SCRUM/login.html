<!DOCTYPE html>

    <title>Verificação de Usuario</title>
    <link rel="stylesheet" href="./css/login.css">
</head>

<body>
    <!--Seção de formulario de login, com nome, email e função do usuario no sistema-->
    <section class="tela_login">
        <form action="" class="form_login">
            <label for="">Nome</label>
            <input type="text" class="login-nome" placeholder="Seu nome" required>
            <!--o required deixa o campo obrigatorio-->
            <label for="">E-mail</label>
            <input type="text" class="login-email" placeholder="E-mail Institucional" required>

            <select class="login-funcao" required>
                <option value="">Selecione a função</option>
                <option value="Aluno" type="radio">Aluno</option>
                <option value="Coordenador" type="radio">Coordenador</option>
            </select>
