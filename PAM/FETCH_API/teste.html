<!DOCTYPE html>
<html>
  <head>
    <title>JS Table Example</title>
  </head>

  <body>
    <table id="minha-tabela">
      <thead>
        <tr>
          <th>Nome</th>
          <th>Idade</th>
        </tr>
      </thead>
      <tbody>
        <!-- O JavaScript vai colocar as linhas novas aqui dentro automaticamente -->
      </tbody>
    </table>
  </body>
</html>
